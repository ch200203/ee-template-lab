name: ai-review
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
jobs:
  preflight:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 3
    outputs:
      run_review: ${{ steps.preflight.outputs.run_review }}
      pr_number: ${{ steps.preflight.outputs.pr_number }}
      head_sha: ${{ steps.preflight.outputs.head_sha }}
      base_sha: ${{ steps.preflight.outputs.base_sha }}
    steps:
      # 기본 브랜치의 리뷰 스크립트만 받는다. PR 코드는 checkout하지 않고 REST로 diff만 읽는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools
      - id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EE_AI_ENABLED: ${{ vars.EE_AI_ENABLED }}
        run: python3 tools/ee_review.py ci-preflight --out "$RUNNER_TEMP/ee-review-input"
      - if: steps.preflight.outputs.run_review == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ee-review-input
          path: ${{ runner.temp }}/ee-review-input
          retention-days: 14
          if-no-files-found: error
  review:
    needs: preflight
    if: needs.preflight.outputs.run_review == 'true'
    runs-on: ubuntu-latest
    environment: ee-ai-review
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ee-review-input
          path: ${{ runner.temp }}/ee-review-input
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EE_GEMINI_MODEL: ${{ vars.EE_GEMINI_MODEL }}
        run: >-
          python3 tools/ee_review.py ci-review --provider gemini
          --input "$RUNNER_TEMP/ee-review-input" --out "$RUNNER_TEMP/ee-review-findings/findings.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ee-review-findings
          path: ${{ runner.temp }}/ee-review-findings
          retention-days: 14
          if-no-files-found: error
  post:
    needs: [preflight, review]
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ee-review-input
          path: ${{ runner.temp }}/ee-review-input
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ee-review-findings
          path: ${{ runner.temp }}/ee-review-findings
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ee_review.py ci-post
          --input "$RUNNER_TEMP/ee-review-input" --findings "$RUNNER_TEMP/ee-review-findings/findings.json"
